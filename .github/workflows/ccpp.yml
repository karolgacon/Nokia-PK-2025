name: C/C++ CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: src

    steps:
    - uses: actions/checkout@v2
    - name: Install Qt
      uses: jurplel/install-qt-action@v2
    - name: cmake
      run: cmake . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_SUPPRESS_DEVELOPER_WARNINGS=TRUE -DCMAKE_CXX_FLAGS="-w"
    - name: make all targets
      run: make all

    - name: UT for BtsApplication
      run: make BtsApplicationUT

    - name: run BTS ut
      run: ./BTS/Tests/Application/BtsApplicationUT

    - name: UT for COMMON
      run: make COMMON_UT

    - name: run COMMON ut
      run: ./COMMON/Tests/COMMON_UT

    - name: UT for UeApplication
      run: make UeApplicationUT

    - name: run UE ut
      run: ./UE/Tests/Application/UeApplicationUT
